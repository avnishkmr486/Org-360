# Netlify build settings for Organization 360 (Next.js 15, App Router).
# Netlify detects Next.js and installs its runtime automatically; no plugin entry needed.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SUPABASE_URL = "https://yczldmywroucxvkxwyur.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_znG3EPnjBBcHe5gVqjHmVw_bISkt0aJ"

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Static brand assets can be cached for a long time.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
